<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Sky</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            height: 100%;
        }
        .sky {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 50% 50%, #5B3A6F 0%, #2A1B3D 100%);
            overflow: hidden;
            z-index: 1;
        }
        .star {
            position: absolute;
            background-color: #EBEAE1;
            border-radius: 50%;
            aspect-ratio: 1/1;
            opacity: 0;
            animation: twinkle 1.5s infinite alternate, glow 2s infinite alternate;
            box-shadow: 0 0 6px 2px #fff8;
        }
        .shooting-star {
            position: absolute;
            width: 80px;
            height: 1.5px;
            background: linear-gradient(90deg, #EBEAE1 60%, rgba(255,255,255,0.0) 100%);
            opacity: 0.95;
            pointer-events: none;
            z-index: 2;
            transform-origin: left center;
            filter: blur(0.6px) brightness(1.3);
            box-shadow: 0 0 5px 1.5px #fff8, 0 0 15px 4px #a7c7ff44;
            animation: shooting 1.5s cubic-bezier(0.4,0,0.2,1) forwards;
        }
        .shooting-star::before {
            content: "";
            position: absolute;
            top: 50%;
            left: -50px;
            width: 80px;
            height: 5px;
            background: radial-gradient(ellipse at left, rgba(180,200,255,0.6) 0%, transparent 80%);
            transform: translateY(-50%) scaleY(0.6) scaleX(1.4);
            filter: blur(3px);
            animation: tailFade 1.5s cubic-bezier(0.4,0,0.2,1) forwards;
            z-index: -1;
        }
        .shooting-star::after {
            content: "";
            position: absolute;
            right: -5px;
            top: 50%;
            transform: translateY(-50%) scale(0.8);
            width: 6px;
            height: 6px;
            background: radial-gradient(circle, #fff 70%, #a7c7ff88 100%);
            border-radius: 50%;
            opacity: 1;
            box-shadow: 0 0 8px 3px #fff, 0 0 20px 8px #a7c7ff55;
            animation: tipShrink 1.5s cubic-bezier(0.4,0,0.2,1) forwards;
            z-index: 3;
        }
        @keyframes tipShrink {
            0% {
                opacity: 1;
                transform: translateY(-50%) scaleX(1) scaleY(1);
            }
            100% {
                opacity: 0;
                transform: translateY(-50%) scaleX(0.3) scaleY(0.3);
            }
        }
        @keyframes twinkle {
            from { opacity: 0.2; }
            to { opacity: 1; }
        }
        @keyframes glow {
            from { box-shadow: 0 0 6px 2px #fff8; }
            to { box-shadow: 0 0 12px 4px #fff8; }
        }
        @keyframes shooting {
            0% {
                opacity: 1;
                transform: rotate(var(--angle)) scaleX(1);
            }
            100% {
                opacity: 0;
                transform: translate(var(--dx), var(--dy)) rotate(var(--angle)) scaleX(0.7);
            }
        }
        @keyframes tailFade {
            0% {
                opacity: 1;
                transform: translateY(-50%) scaleY(1);
            }
            100% {
                opacity: 0;
                transform: translateY(-50%) scaleY(0.3);
            }
        }
    </style>
</head>
<body>
    <div class="sky"></div>
    <script>
        const MAX_STARS = 700;
        let stars = [];
        let lastClickX = window.innerWidth / 2;
        let lastClickY = window.innerHeight / 2;

        function createStars(numStars) {
            const sky = document.querySelector('.sky');
            const fragment = document.createDocumentFragment();
            for (let i = 0; i < numStars; i++) {
                const star = document.createElement('div');
                star.className = 'star';
                const size = Math.random() * 2 + 1;
                star.style.width = `${size}px`;
                star.style.height = `${size}px`;
                star.style.top = `${Math.random() * 100}%`;
                star.style.left = `${Math.random() * 100}%`;
                star.style.animationDelay = `${Math.random() * 1.5}s`;
                fragment.appendChild(star);
                stars.push(star);
            }
            sky.appendChild(fragment);
            enforceStarLimit();
        }

        function createStarsAt(x, y, numStars) {
            const sky = document.querySelector('.sky');
            const rect = sky.getBoundingClientRect();
            const fragment = document.createDocumentFragment();
            for (let i = 0; i < numStars; i++) {
                const star = document.createElement('div');
                star.className = 'star';
                const size = Math.random() * 2 + 1;
                star.style.width = `${size}px`;
                star.style.height = `${size}px`;
                const offsetX = (Math.random() - 0.5) * 150;
                const offsetY = (Math.random() - 0.5) * 150;
                const left = ((x - rect.left + offsetX) / rect.width) * 100;
                const top = ((y - rect.top + offsetY) / rect.height) * 100;
                star.style.left = `${left}%`;
                star.style.top = `${top}%`;
                star.style.animationDelay = `${Math.random() * 1.5}s`;
                fragment.appendChild(star);
                stars.push(star);
            }
            sky.appendChild(fragment);
            enforceStarLimit();
        }

        function enforceStarLimit() {
            while (stars.length > MAX_STARS) {
                const oldStar = stars.shift();
                if (oldStar && oldStar.parentNode) {
                    oldStar.parentNode.removeChild(oldStar);
                }
            }
        }

        function createShootingStar(x, y) {
            const sky = document.querySelector('.sky');
            const rect = sky.getBoundingClientRect();
            
            let startX, startY;
            if (x && y) {
                startX = x - rect.left;
                startY = y - rect.top;
            } else {
                startX = Math.max(50, lastClickX - 100);
                startY = Math.max(50, lastClickY - 50);
            }
            
            const dx = Math.random() * 300 + 200;
            const dy = dx * (0.3 + Math.random() * 0.3);
            const angleRad = Math.atan2(dy, dx);
            const angleDeg = angleRad * 180 / Math.PI;
            
            const shootingStar = document.createElement('div');
            shootingStar.className = 'shooting-star';
            shootingStar.style.left = `${startX}px`;
            shootingStar.style.top = `${startY}px`;
            shootingStar.style.setProperty('--dx', `${dx}px`);
            shootingStar.style.setProperty('--dy', `${dy}px`);
            shootingStar.style.setProperty('--angle', `${angleDeg}deg`);
            sky.appendChild(shootingStar);
            
            shootingStar.addEventListener('animationend', () => {
                if (shootingStar.parentNode) {
                    shootingStar.parentNode.removeChild(shootingStar);
                }
            });
        }

        createStars(270);

        document.querySelector('.sky').addEventListener('click', function (e) {
            lastClickX = e.clientX;
            lastClickY = e.clientY;
            createStarsAt(e.clientX, e.clientY, 17);
            createShootingStar(e.clientX, e.clientY);
        });

        setInterval(() => {
            createShootingStar();
        }, 7000);

        setInterval(() => {
            createShootingStar();
            createShootingStar();
        }, 27000);
    </script>
</body>
</html>
