<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Mountains</title>
    <style>
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
        }
        body {
            background: linear-gradient(to bottom, #1a0d2e 0%, #2a1c3d 50%, #3d2a5d 100%);
            font-family: Arial, sans-serif;
        }
        .terrain {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
        }
        #terrain-canvas {
            width: 100%;
            height: 100%;
            display: block;
            cursor: none;
        }
        .info {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #00FFFF;
            font-size: 14px;
            text-shadow: 0 0 10px #00FFFF;
            pointer-events: none;
            z-index: 10;
        }
    </style>
</head>
<body>
    <div class="info">
        Mueve el mouse para interactuar con las montañas
    </div>
    <div class="terrain">
        <canvas id="terrain-canvas"></canvas>
    </div>
    <script>
        const canvas = document.getElementById('terrain-canvas');
        const ctx = canvas.getContext('2d');
        const container = document.querySelector('.terrain');

        let width = container.clientWidth;
        let height = container.clientHeight;
        canvas.width = width;
        canvas.height = height;

        // Variables del mouse con suavizado
        let mouseX = width / 2;
        let mouseY = height / 2;
        let targetMouseX = mouseX;
        let targetMouseY = mouseY;

        document.addEventListener('mousemove', (e) => {
            targetMouseX = e.clientX;
            targetMouseY = e.clientY;
        });

        let time = 0;

        // Configuración de montañas mejorada
        const mountains = [
            { 
                cx: 0.15, cy: 0.75, r: 0.18, 
                color: '#00FFFF', glow: '#66FFFF', 
                freq: 2.5, amplitude: 12,
                fleeStrength: 0.3
            },
            { 
                cx: 0.35, cy: 0.65, r: 0.25, 
                color: '#00DDFF', glow: '#88DDFF', 
                freq: 3, amplitude: 15,
                fleeStrength: 0.25
            },
            { 
                cx: 0.5, cy: 0.6, r: 0.3, 
                color: '#00BBFF', glow: '#77BBFF', 
                freq: 4, amplitude: 18,
                fleeStrength: 0.2
            },
            { 
                cx: 0.65, cy: 0.68, r: 0.24, 
                color: '#0099FF', glow: '#6699FF', 
                freq: 3.5, amplitude: 14,
                fleeStrength: 0.28
            },
            { 
                cx: 0.85, cy: 0.78, r: 0.16, 
                color: '#0077FF', glow: '#5577FF', 
                freq: 2, amplitude: 10,
                fleeStrength: 0.35
            }
        ];

        function lerp(a, b, t) {
            return a + (b - a) * t;
        }

        function generateMountainPoints(mountain, mouseInfluence, time) {
            const points = [];
            const segments = 64;
            
            for (let i = 0; i <= segments; i++) {
                const angle = (i / segments) * Math.PI;
                
                // Deformación animada más suave
                const waveOffset = mountain.amplitude * Math.sin(angle * mountain.freq + time / 80);
                const mouseDeform = mouseInfluence * 8 * Math.sin(angle * 6 + time / 40);
                
                const radius = mountain.r * Math.min(width, height) + waveOffset - mouseDeform;
                
                const x = mountain.cx * width + radius * Math.cos(angle);
                const y = mountain.cy * height + radius * Math.sin(angle) * 0.6; // Aplanar verticalmente
                
                points.push({ x, y });
            }
            
            return points;
        }

        function drawMountain(mountain, mouseInfluence, time) {
            // Calcular posición con huida del mouse
            let cx = mountain.cx * width;
            let cy = mountain.cy * height;
            
            const dx = mouseX - cx;
            const dy = mouseY - cy;
            const dist = Math.sqrt(dx * dx + dy * dy);
            const fleeRadius = Math.max(width, height) * 0.4;
            
            mouseInfluence = Math.max(0, 1 - dist / fleeRadius);
            
            // Aplicar huida
            if (mouseInfluence > 0) {
                const fleeAngle = Math.atan2(dy, dx);
                const fleeAmount = mouseInfluence * mountain.fleeStrength;
                cx -= Math.cos(fleeAngle) * fleeAmount * width * 0.3;
                cy -= Math.sin(fleeAngle) * fleeAmount * height * 0.2;
            }
            
            // Actualizar posición de la montaña
            const adjustedMountain = { ...mountain, cx: cx / width, cy: cy / height };
            const points = generateMountainPoints(adjustedMountain, mouseInfluence, time);
            
            // Dibujar relleno con gradiente
            ctx.save();
            
            // Crear gradiente
            const gradient = ctx.createLinearGradient(cx, cy - mountain.r * height, cx, cy + mountain.r * height);
            gradient.addColorStop(0, mountain.color + '40');
            gradient.addColorStop(0.7, mountain.color + '20');
            gradient.addColorStop(1, mountain.color + '10');
            
            // Dibujar montaña rellena
            ctx.beginPath();
            ctx.moveTo(points[0].x, points[0].y);
            for (let i = 1; i < points.length; i++) {
                ctx.lineTo(points[i].x, points[i].y);
            }
            ctx.lineTo(points[points.length - 1].x, height);
            ctx.lineTo(points[0].x, height);
            ctx.closePath();
            
            ctx.fillStyle = gradient;
            ctx.fill();
            
            // Dibujar contorno con brillo
            ctx.beginPath();
            ctx.moveTo(points[0].x, points[0].y);
            for (let i = 1; i < points.length; i++) {
                ctx.lineTo(points[i].x, points[i].y);
            }
            
            // Efecto de brillo basado en la proximidad del mouse
            const glowIntensity = 1 + mouseInfluence * 2;
            ctx.shadowColor = mountain.glow;
            ctx.shadowBlur = 8 * glowIntensity;
            ctx.strokeStyle = mountain.color;
            ctx.lineWidth = 1.5 + mouseInfluence;
            ctx.stroke();
            
            ctx.restore();
            
            return points;
        }

        function drawConnections(mountainBases) {
            if (mountainBases.length < 2) return;
            
            ctx.save();
            ctx.globalAlpha = 0.3;
            ctx.strokeStyle = '#00FFFF';
            ctx.lineWidth = 0.8;
            
            // Conectar montañas adyacentes
            for (let i = 0; i < mountainBases.length - 1; i++) {
                const baseA = mountainBases[i];
                const baseB = mountainBases[i + 1];
                
                // Conectar algunos puntos selectos
                for (let j = 0; j < baseA.length; j += 8) {
                    if (j < baseB.length) {
                        const p1 = baseA[j];
                        const p2 = baseB[j];
                        
                        // Línea ondulada
                        const midX = (p1.x + p2.x) / 2;
                        const midY = (p1.y + p2.y) / 2;
                        const offset = 5 * Math.sin(time / 60 + j / 10 + i);
                        
                        ctx.beginPath();
                        ctx.moveTo(p1.x, p1.y);
                        ctx.quadraticCurveTo(midX, midY + offset, p2.x, p2.y);
                        ctx.stroke();
                    }
                }
            }
            
            ctx.restore();
        }

        function drawStars() {
            ctx.save();
            ctx.fillStyle = '#FFFFFF';
            
            // Estrellas fijas
            for (let i = 0; i < 80; i++) {
                const x = (i * 123.45) % width;
                const y = (i * 67.89) % (height * 0.4);
                const size = 0.5 + (i % 3) * 0.5;
                const twinkle = 0.5 + 0.5 * Math.sin(time / 30 + i);
                
                ctx.globalAlpha = twinkle * 0.8;
                ctx.beginPath();
                ctx.arc(x, y, size, 0, Math.PI * 2);
                ctx.fill();
            }
            
            ctx.restore();
        }

        function animate() {
            // Suavizar movimiento del mouse
            mouseX = lerp(mouseX, targetMouseX, 0.05);
            mouseY = lerp(mouseY, targetMouseY, 0.05);
            
            // Limpiar canvas
            ctx.clearRect(0, 0, width, height);
            
            // Dibujar estrellas
            drawStars();
            
            // Dibujar montañas y recopilar sus bases
            const mountainBases = [];
            mountains.forEach(mountain => {
                const base = drawMountain(mountain, 0, time);
                mountainBases.push(base);
            });
            
            // Dibujar conexiones entre montañas
            drawConnections(mountainBases);
            
            time++;
            requestAnimationFrame(animate);
        }

        function resizeCanvas() {
            width = container.clientWidth;
            height = container.clientHeight;
            canvas.width = width;
            canvas.height = height;
        }

        // Manejar redimensionado
        let resizeTimeout;
        window.addEventListener('resize', () => {
            clearTimeout(resizeTimeout);
            resizeTimeout = setTimeout(resizeCanvas, 100);
        });

        // Observador de redimensionado
        const observer = new ResizeObserver(resizeCanvas);
        observer.observe(container);

        // Iniciar animación
        animate();
    </script>
</body>
</html>
