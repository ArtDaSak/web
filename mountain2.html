<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Synthwave Mountains</title>
    <style>
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
        }
        body {
            background: linear-gradient(to bottom, #0a0a2e 0%, #16213e 30%, #1a1a4d 60%, #2d1b69 100%);
            font-family: 'Courier New', monospace;
        }
        .terrain {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
        }
        #terrain-canvas {
            width: 100%;
            height: 100%;
            display: block;
        }
    </style>
</head>
<body>
    <div class="terrain">
        <canvas id="terrain-canvas"></canvas>
    </div>
    <script>
        const canvas = document.getElementById('terrain-canvas');
        const ctx = canvas.getContext('2d');
        const container = document.querySelector('.terrain');

        let width = container.clientWidth;
        let height = container.clientHeight;
        canvas.width = width;
        canvas.height = height;

        // Variables del mouse
        let mouseX = width / 2;
        let mouseY = height / 2;
        let targetMouseX = mouseX;
        let targetMouseY = mouseY;

        document.addEventListener('mousemove', (e) => {
            targetMouseX = e.clientX;
            targetMouseY = e.clientY;
        });

        let time = 0;

        // Configuración de montañas en wireframe
        const mountainLayers = [
            {
                mountains: [
                    { cx: 0.1, cy: 0.85, width: 0.25, height: 0.15, detail: 32, color: '#ff00ff', glow: '#ff44ff' },
                    { cx: 0.3, cy: 0.75, width: 0.3, height: 0.25, detail: 40, color: '#ff0080', glow: '#ff4499' },
                    { cx: 0.55, cy: 0.65, width: 0.4, height: 0.35, detail: 48, color: '#ff0040', glow: '#ff4477' },
                    { cx: 0.8, cy: 0.8, width: 0.28, height: 0.2, detail: 36, color: '#ff0060', glow: '#ff4488' }
                ],
                wireSpacing: 0.015,
                fleeStrength: 0.4
            },
            {
                mountains: [
                    { cx: 0.15, cy: 0.9, width: 0.2, height: 0.1, detail: 28, color: '#0080ff', glow: '#4499ff' },
                    { cx: 0.4, cy: 0.82, width: 0.35, height: 0.18, detail: 44, color: '#0060ff', glow: '#4488ff' },
                    { cx: 0.7, cy: 0.88, width: 0.25, height: 0.12, detail: 32, color: '#0040ff', glow: '#4477ff' }
                ],
                wireSpacing: 0.02,
                fleeStrength: 0.3
            },
            {
                mountains: [
                    { cx: 0.2, cy: 0.95, width: 0.15, height: 0.05, detail: 24, color: '#00ffff', glow: '#44ffff' },
                    { cx: 0.5, cy: 0.92, width: 0.3, height: 0.08, detail: 36, color: '#00ccff', glow: '#44ddff' },
                    { cx: 0.75, cy: 0.96, width: 0.2, height: 0.04, detail: 28, color: '#0099ff', glow: '#44bbff' }
                ],
                wireSpacing: 0.025,
                fleeStrength: 0.2
            }
        ];

        function lerp(a, b, t) {
            return a + (b - a) * t;
        }

        function drawSun() {
            const sunX = width * 0.5;
            const sunY = height * 0.35;
            const sunRadius = Math.min(width, height) * 0.15;
            
            ctx.save();
            
            // Gradiente del sol
            const sunGradient = ctx.createRadialGradient(sunX, sunY, 0, sunX, sunY, sunRadius * 1.5);
            sunGradient.addColorStop(0, '#ff00ff');
            sunGradient.addColorStop(0.3, '#ff0080');
            sunGradient.addColorStop(0.6, '#ff4000');
            sunGradient.addColorStop(1, 'transparent');
            
            // Dibujar resplandor
            ctx.fillStyle = sunGradient;
            ctx.beginPath();
            ctx.arc(sunX, sunY, sunRadius * 1.5, 0, Math.PI * 2);
            ctx.fill();
            
            // Líneas horizontales del sol
            ctx.strokeStyle = '#ff00ff';
            ctx.lineWidth = 2;
            const lineSpacing = sunRadius * 0.1;
            
            for (let i = 0; i < 20; i++) {
                const y = sunY - sunRadius + (i * lineSpacing);
                const lineWidth = Math.sqrt(sunRadius * sunRadius - Math.pow(y - sunY, 2)) * 2;
                
                if (lineWidth > 0) {
                    ctx.globalAlpha = 0.8 - (Math.abs(y - sunY) / sunRadius) * 0.3;
                    ctx.beginPath();
                    ctx.moveTo(sunX - lineWidth / 2, y);
                    ctx.lineTo(sunX + lineWidth / 2, y);
                    ctx.stroke();
                }
            }
            
            ctx.restore();
        }

        function generateMountainProfile(mountain, mouseInfluence, layerTime) {
            const points = [];
            const segments = mountain.detail;
            
            for (let i = 0; i <= segments; i++) {
                const t = i / segments;
                const angle = Math.PI * t;
                
                // Forma básica de la montaña
                let y = Math.sin(angle);
                
                // Agregar ruido para detalle
                y += 0.3 * Math.sin(angle * 4 + layerTime / 100);
                y += 0.2 * Math.sin(angle * 8 + layerTime / 80);
                y += 0.1 * Math.sin(angle * 16 + layerTime / 60);
                
                // Deformación por mouse
                const mouseDeform = mouseInfluence * 0.3 * Math.sin(angle * 6 + layerTime / 40);
                y -= mouseDeform;
                
                const x = mountain.cx * width + (t - 0.5) * mountain.width * width;
                const yPos = mountain.cy * height - y * mountain.height * height;
                
                points.push({ x, y: yPos });
            }
            
            return points;
        }

        function drawWireframeMountain(mountain, mouseInfluence, layerTime, wireSpacing) {
            // Calcular huida del mouse
            const mountainCenterX = mountain.cx * width;
            const mountainCenterY = mountain.cy * height;
            const dx = mouseX - mountainCenterX;
            const dy = mouseY - mountainCenterY;
            const dist = Math.sqrt(dx * dx + dy * dy);
            const fleeRadius = Math.max(width, height) * 0.3;
            
            mouseInfluence = Math.max(0, 1 - dist / fleeRadius);
            
            // Aplicar desplazamiento por huida
            let offsetX = 0, offsetY = 0;
            if (mouseInfluence > 0) {
                const fleeAngle = Math.atan2(dy, dx);
                offsetX = -Math.cos(fleeAngle) * mouseInfluence * 50;
                offsetY = -Math.sin(fleeAngle) * mouseInfluence * 30;
            }
            
            // Generar perfil de la montaña
            const adjustedMountain = {
                ...mountain,
                cx: (mountainCenterX + offsetX) / width,
                cy: (mountainCenterY + offsetY) / height
            };
            
            const profile = generateMountainProfile(adjustedMountain, mouseInfluence, layerTime);
            
            ctx.save();
            
            // Intensidad de brillo basada en proximidad del mouse
            const glowIntensity = 1 + mouseInfluence * 2;
            ctx.shadowColor = mountain.glow;
            ctx.shadowBlur = 5 * glowIntensity;
            ctx.strokeStyle = mountain.color;
            ctx.lineWidth = 1 + mouseInfluence * 0.5;
            
            // Dibujar líneas de wireframe horizontales
            const wireLines = Math.floor(mountain.height * height / (wireSpacing * height));
            
            for (let i = 0; i <= wireLines; i++) {
                const yLevel = adjustedMountain.cy * height - (i / wireLines) * mountain.height * height;
                
                ctx.globalAlpha = 0.6 + mouseInfluence * 0.4;
                ctx.beginPath();
                
                let startX = null;
                for (const point of profile) {
                    if (point.y <= yLevel) {
                        if (startX === null) startX = point.x;
                        ctx.lineTo(point.x, yLevel);
                    } else if (startX !== null) {
                        break;
                    }
                }
                ctx.stroke();
            }
            
            // Dibujar líneas verticales del wireframe
            const verticalLines = Math.floor(mountain.width * width / (wireSpacing * width));
            
            for (let i = 0; i <= verticalLines; i++) {
                const xPos = adjustedMountain.cx * width + (i / verticalLines - 0.5) * mountain.width * width;
                
                ctx.globalAlpha = 0.4 + mouseInfluence * 0.3;
                ctx.beginPath();
                
                // Encontrar intersección con el perfil
                let intersectionY = null;
                for (let j = 0; j < profile.length - 1; j++) {
                    const p1 = profile[j];
                    const p2 = profile[j + 1];
                    
                    if ((p1.x <= xPos && xPos <= p2.x) || (p2.x <= xPos && xPos <= p1.x)) {
                        const t = (xPos - p1.x) / (p2.x - p1.x);
                        intersectionY = p1.y + t * (p2.y - p1.y);
                        break;
                    }
                }
                
                if (intersectionY !== null) {
                    ctx.moveTo(xPos, intersectionY);
                    ctx.lineTo(xPos, adjustedMountain.cy * height);
                    ctx.stroke();
                }
            }
            
            // Dibujar contorno principal
            ctx.globalAlpha = 0.9 + mouseInfluence * 0.1;
            ctx.lineWidth = 2 + mouseInfluence;
            ctx.beginPath();
            ctx.moveTo(profile[0].x, profile[0].y);
            for (let i = 1; i < profile.length; i++) {
                ctx.lineTo(profile[i].x, profile[i].y);
            }
            ctx.stroke();
            
            ctx.restore();
        }

        function drawStars() {
            ctx.save();
            ctx.fillStyle = '#ffffff';
            
            for (let i = 0; i < 150; i++) {
                const x = (i * 137.5) % width;
                const y = (i * 83.7) % (height * 0.6);
                const size = 0.5 + (i % 4) * 0.3;
                const twinkle = 0.3 + 0.7 * Math.sin(time / 60 + i * 0.1);
                
                ctx.globalAlpha = twinkle;
                ctx.beginPath();
                ctx.arc(x, y, size, 0, Math.PI * 2);
                ctx.fill();
            }
            
            ctx.restore();
        }

        function drawGrid() {
            ctx.save();
            ctx.strokeStyle = '#ff00ff';
            ctx.lineWidth = 1;
            ctx.globalAlpha = 0.1;
            
            // Líneas horizontales
            const gridSpacing = height * 0.05;
            for (let y = height * 0.7; y < height; y += gridSpacing) {
                ctx.beginPath();
                ctx.moveTo(0, y);
                ctx.lineTo(width, y);
                ctx.stroke();
            }
            
            // Líneas verticales con perspectiva
            const verticalSpacing = width * 0.08;
            for (let x = 0; x < width; x += verticalSpacing) {
                ctx.beginPath();
                ctx.moveTo(x, height * 0.7);
                ctx.lineTo(x, height);
                ctx.stroke();
            }
            
            ctx.restore();
        }

        function drawCursor() {
            ctx.save();
            
            // Cursor principal
            ctx.strokeStyle = '#00ffff';
            ctx.fillStyle = '#00ffff';
            ctx.lineWidth = 2;
            ctx.globalAlpha = 0.8;
            
            // Cruz del cursor
            ctx.beginPath();
            ctx.moveTo(mouseX - 10, mouseY);
            ctx.lineTo(mouseX + 10, mouseY);
            ctx.moveTo(mouseX, mouseY - 10);
            ctx.lineTo(mouseX, mouseY + 10);
            ctx.stroke();
            
            // Círculo central
            ctx.beginPath();
            ctx.arc(mouseX, mouseY, 3, 0, Math.PI * 2);
            ctx.fill();
            
            // Anillo exterior animado
            ctx.globalAlpha = 0.4;
            ctx.beginPath();
            ctx.arc(mouseX, mouseY, 8 + 3 * Math.sin(time / 20), 0, Math.PI * 2);
            ctx.stroke();
            
            ctx.restore();
        }

        function animate() {
            // Suavizar movimiento del mouse
            mouseX = lerp(mouseX, targetMouseX, 0.08);
            mouseY = lerp(mouseY, targetMouseY, 0.08);
            
            // Limpiar canvas
            ctx.clearRect(0, 0, width, height);
            
            // Dibujar elementos del fondo
            drawStars();
            drawSun();
            drawGrid();
            
            // Dibujar capas de montañas
            mountainLayers.forEach((layer, layerIndex) => {
                layer.mountains.forEach(mountain => {
                    drawWireframeMountain(mountain, 0, time + layerIndex * 20, layer.wireSpacing);
                });
            });
            
            // Dibujar cursor
            drawCursor();
            
            time++;
            requestAnimationFrame(animate);
        }

        function resizeCanvas() {
            width = container.clientWidth;
            height = container.clientHeight;
            canvas.width = width;
            canvas.height = height;
        }

        window.addEventListener('resize', () => {
            resizeCanvas();
        });

        animate();
    </script>
</body>
</html>
