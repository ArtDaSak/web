<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mountain</title>
    <style>
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
        }
        body {
            background: #2a1c3d;
            overflow: hidden;
            height: 100%;
        }
        .terrain {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: linear-gradient(to bottom, #A77BCA 0%, #3D2A5D 100%);
            z-index: 1;
        }
        #terrain-canvas {
            width: 100vw;
            height: 100vh;
            display: block;
        }
    </style>
</head>
<body>
    <div class="terrain">
        <canvas id="terrain-canvas"></canvas>
    </div>
    <script>
        const canvas = document.getElementById('terrain-canvas');
        const ctx = canvas.getContext('2d', { willReadFrequently: true });
        const container = document.querySelector('.terrain');

        let width = container.clientWidth;
        let height = container.clientHeight;
        canvas.width = width;
        canvas.height = height;

        // Mouse real y suavizado
        let mouseX = width / 2, mouseY = height / 2;
        let targetMouseX = mouseX, targetMouseY = mouseY;

        document.addEventListener('mousemove', (e) => {
            targetMouseX = e.clientX;
            targetMouseY = e.clientY;
        });

        let time = 0;

        // Configuración de montañas
        const mountains = [
            { cx: 0.25, cy: 0.7, r: 0.22, color: '#00FFFF', shadow: '#66FFFF', freq: 3 },
            { cx: 0.5,  cy: 0.6, r: 0.28, color: '#00FFFF', shadow: '#66FFFF', freq: 4 },
            { cx: 0.75, cy: 0.72, r: 0.20, color: '#00FFFF', shadow: '#66FFFF', freq: 2.5 }
        ];

        // Estado del "trampolín" (ahora solo como parte del terreno)
        let bounce = 0;
        let bounceTarget = 0;
        let deform = 0;
        let deformTarget = 0;

        function lerp(a, b, t) {
            return a + (b - a) * t;
        }

        function drawMountain(cx, cy, r, freq, t, mouseInfluence) {
            const points = [];
            const framePoints = 32;
            for (let i = 0; i <= framePoints; i++) {
                const angle = (i / framePoints) * Math.PI;
                // Suaviza la deformación de la montaña
                const radius = r + 18 * Math.sin(angle * freq + t / 60) * (0.7 + 0.3 * (1 - mouseInfluence));
                const x = cx + radius * Math.cos(angle);
                const y = cy + radius * Math.sin(angle) * 0.7;
                points.push({ x, y });
            }
            return points;
        }

        // Guarda las bases de las montañas para conectar con la red
        let bases = [];

        function drawTerrain() {
            // Interpolación suave del mouse (más lenta para estética)
            mouseX = lerp(mouseX, targetMouseX, 0.025);
            mouseY = lerp(mouseY, targetMouseY, 0.025);

            ctx.clearRect(0, 0, width, height);

            // Interacción de huida: si el mouse se acerca, las montañas y el "trampolín" huyen
            const fleeStrength = 0.22;
            const fleeRadius = Math.max(width, height) * 0.35;

            // Calcula la fuerza de huida para cada montaña
            bases = [];
            mountains.forEach((m, idx) => {
                ctx.save();
                ctx.beginPath();
                let cx = m.cx * width;
                let cy = m.cy * height;
                const r = m.r * Math.min(width, height);

                // Distancia al mouse
                const dx = mouseX - cx;
                const dy = mouseY - cy;
                const dist = Math.sqrt(dx * dx + dy * dy);
                let mouseInfluence = Math.max(0, 1 - dist / fleeRadius);

                // Movimiento de huida más suave y natural
                if (mouseInfluence > 0) {
                    const fleeAngle = Math.atan2(dy, dx);
                    cx -= Math.cos(fleeAngle) * mouseInfluence * fleeStrength * width;
                    cy -= Math.sin(fleeAngle) * mouseInfluence * fleeStrength * height * 0.7;
                }

                // Suaviza la animación de rebote/deformación
                bounceTarget = mouseInfluence * 18 * Math.sin(time / 24 + dist / 120);
                deformTarget = mouseInfluence * 0.12;
                bounce = lerp(bounce, bounceTarget, 0.04);
                deform = lerp(deform, deformTarget, 0.04);

                // Aplica rebote y deformación al centro de la montaña central
                let cyMod = cy;
                if (idx === 1) {
                    cyMod += bounce;
                }

                const points = drawMountain(cx, cyMod, r, m.freq, time, mouseInfluence);

                ctx.moveTo(points[0].x, points[0].y);
                for (let i = 1; i < points.length; i++) {
                    ctx.lineTo(points[i].x, points[i].y);
                }
                ctx.lineTo(cx, height);
                ctx.lineTo(points[0].x, height);
                ctx.closePath();

                ctx.strokeStyle = m.color;
                ctx.lineWidth = 1.2;
                ctx.stroke();
                ctx.restore();

                bases.push(points.map(p => ({ x: p.x, y: p.y })));
            });

            // Conectar bases de montañas con líneas (sin sombra)
            ctx.save();
            ctx.beginPath();
            for (let i = 0; i < bases.length - 1; i++) {
                const baseA = bases[i];
                const baseB = bases[i + 1];
                for (let j = 0; j < baseA.length; j++) {
                    ctx.moveTo(baseA[j].x, baseA[j].y);
                    ctx.lineTo(baseB[j].x, baseB[j].y);
                }
            }
            ctx.strokeStyle = '#00FFFF88';
            ctx.lineWidth = 1;
            ctx.stroke();
            ctx.restore();

            // Conectar bases de montañas con arcos animados (sin sombra)
            ctx.save();
            ctx.beginPath();
            for (let i = 0; i < bases.length - 1; i++) {
                const baseA = bases[i];
                const baseB = bases[i + 1];
                for (let j = 0; j < baseA.length; j++) {
                    const p1 = baseA[j];
                    const p2 = baseB[j];
                    const mx = (p1.x + p2.x) / 2;
                    const my = (p1.y + p2.y) / 2;
                    const offset = 8 * Math.sin(time / 80 + j / 7 + i);
                    const ctrlX = mx;
                    const ctrlY = my - offset;
                    ctx.moveTo(p1.x, p1.y);
                    ctx.quadraticCurveTo(ctrlX, ctrlY, p2.x, p2.y);
                }
            }
            ctx.strokeStyle = '#00FFFF55';
            ctx.lineWidth = 1;
            ctx.stroke();
            ctx.restore();

            // Dibuja el "trampolín" como parte del terreno, pero sin concepto de trampolín
            drawSoftEllipse(bounce, deform, bases[1]);

            time++;
            requestAnimationFrame(drawTerrain);
        }

        // Dibuja una elipse suave en la base central, como parte del terreno
        function drawSoftEllipse(bounce = 0, deform = 0, mountainBase = []) {
            // Elipse principal (como si fuera una loma suave)
            const trampWidth = width * 0.32 * (1 + deform * 0.2);
            const trampHeight = height * 0.06 * (1 - deform * 0.3) + bounce;
            const trampX = width / 2;
            const trampY = height * 0.92 - bounce * 0.5;

            ctx.save();
            ctx.beginPath();
            ctx.ellipse(trampX, trampY, trampWidth / 2, trampHeight / 2, 0, 0, 2 * Math.PI);
            ctx.fillStyle = "#fff";
            ctx.globalAlpha = 0.13;
            ctx.fill();
            ctx.globalAlpha = 1;
            ctx.lineWidth = 2;
            ctx.strokeStyle = "#00FFFF";
            ctx.stroke();
            ctx.restore();

            // Borde inferior (sombra suave)
            ctx.save();
            ctx.beginPath();
            ctx.ellipse(trampX, trampY + trampHeight * 0.18, trampWidth * 0.48, trampHeight * 0.18, 0, 0, 2 * Math.PI);
            ctx.fillStyle = "#00ffff22";
            ctx.globalAlpha = 0.5;
            ctx.fill();
            ctx.restore();

            // Red lateral izquierda y derecha (como cuerdas suaves)
            drawNet(trampX - trampWidth / 2, trampY, -1, trampHeight, trampWidth, mountainBase);
            drawNet(trampX + trampWidth / 2, trampY, 1, trampHeight, trampWidth, mountainBase);
        }

        // Dibuja cuerdas suaves (solo la central)
        function drawNet(baseX, baseY, side, trampHeight, trampWidth, mountainBase = []) {
            ctx.save();
            ctx.strokeStyle = "#00FFFF";
            ctx.globalAlpha = 0.5;
            ctx.lineWidth = 1.5;

            // Poste
            const postHeight = trampHeight * 5.5;
            const postTopX = baseX + side * trampWidth * 0.08;
            const postTopY = baseY - postHeight;
            ctx.beginPath();
            ctx.moveTo(baseX, baseY);
            ctx.lineTo(postTopX, postTopY);
            ctx.stroke();

            // Encuentra el punto más cercano de la base de la montaña
            let closest = { x: postTopX, y: postTopY };
            if (mountainBase && mountainBase.length) {
                let minDist = Infinity;
                for (const p of mountainBase) {
                    const d = Math.hypot(p.x - postTopX, p.y - postTopY);
                    if (d < minDist) {
                        minDist = d;
                        closest = p;
                    }
                }
            }

            // Línea que une el poste con la montaña (solo una cuerda central)
            ctx.save();
            ctx.strokeStyle = "#00FFFF";
            ctx.globalAlpha = 0.6;
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(postTopX, postTopY);
            ctx.lineTo(closest.x, closest.y);
            ctx.stroke();
            ctx.restore();

            // Red vertical central
            ctx.beginPath();
            ctx.moveTo(baseX, baseY);
            ctx.lineTo(postTopX, postTopY);
            ctx.stroke();

            // Red horizontal curva central
            ctx.beginPath();
            ctx.moveTo(baseX, baseY - postHeight * 0.5);
            ctx.bezierCurveTo(
                baseX + side * trampWidth * 0.03, baseY - postHeight * 0.5 - trampHeight * 0.1,
                baseX + side * trampWidth * 0.06, baseY - postHeight * 0.5 - trampHeight * 0.1,
                postTopX, postTopY + trampHeight * 0.1
            );
            ctx.stroke();

            ctx.restore();
        }

        function resizeCanvas() {
            width = container.clientWidth;
            height = container.clientHeight;
            canvas.width = width;
            canvas.height = height;
        }

        let resizeTimeout;
        window.addEventListener('resize', () => {
            clearTimeout(resizeTimeout);
            resizeTimeout = setTimeout(() => {
                resizeCanvas();
            }, 200);
        });

        const observer = new ResizeObserver(() => {
            resizeCanvas();
        });
        observer.observe(container);

        drawTerrain();
    </script>
</body>
</html>
