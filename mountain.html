<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mountain</title>
    <style>
        body, html {
            background: linear-gradient(to top, #3D2A5D 0%, #A77BCA 100%);
            margin: 0;
            padding: 0;
            height: 100%;
        }
        .terrain {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(to bottom, #A77BCA 0%, #3D2A5D 100%);
            z-index: 3;
        }

        #terrain-canvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        .terrain canvas {
            filter: drop-shadow(0 0 8px #00ffff88);
        }
    </style>
</head>
<body>
    <div class="terrain">
        <canvas id="terrain-canvas"></canvas>
    </div>
    <script>
        const canvas = document.getElementById('terrain-canvas');
        const ctx = canvas.getContext('2d');
        const container = document.querySelector('.terrain');

        let width = container.clientWidth;
        let height = container.clientHeight;
        canvas.width = width;
        canvas.height = height;

        let mouseX = width / 2;
        let mouseY = height / 2;
        let throttleTimeout = false;

        document.addEventListener('mousemove', (e) => {
            if (!throttleTimeout) {
                throttleTimeout = true;
                mouseX = e.clientX;
                mouseY = e.clientY;
                requestAnimationFrame(() => {
                    throttleTimeout = false;
                });
            }
        });

        let isCanvasVisible = true;
        let time = 0;

        function drawTerrain() {
            if (!isCanvasVisible) return;

            ctx.clearRect(0, 0, width, height);

            // --- Marco multiforme ---
            ctx.save();
            ctx.beginPath();
            const framePoints = 32;
            const frameRadius = Math.min(width, height) * 0.48;
            const centerX = width / 2;
            const centerY = height / 2;
            for (let i = 0; i <= framePoints; i++) {
                const angle = (i / framePoints) * Math.PI * 2;
                const r = frameRadius + 28 * Math.sin(angle * 3 + time / 40);
                const x = centerX + r * Math.cos(angle);
                const y = centerY + r * Math.sin(angle);
                if (i === 0) ctx.moveTo(x, y);
                else ctx.lineTo(x, y);
            }
            ctx.closePath();
            ctx.clip();
            // --- Fin marco multiforme ---

            ctx.save();
            ctx.strokeStyle = '#00FFFF';
            ctx.lineWidth = 1.2;
            ctx.shadowColor = '#66FFFF';
            ctx.shadowBlur = 8;

            const numHorizontal = 22;
            const numVertical = 22;
            const amplitude = 22 + 10 * Math.sin(time / 60);

            for (let i = 0; i <= numHorizontal; i++) {
                const t = i / numHorizontal;
                const y = height * (1 - Math.pow(t, 0.6));
                ctx.beginPath();
                ctx.moveTo(0, y);
                for (let x = 0; x <= width; x += 8) {
                    const phase = (mouseX / width) * Math.PI * 2 + time / 40;
                    const offset = amplitude * Math.sin((x / width) * Math.PI * 2 + phase + t * 2);
                    ctx.lineTo(x, y + offset);
                }
                ctx.stroke();
            }

            const vpX = width / 2 + (mouseX / width - 0.5) * 0.08 * width;
            const vpY = 0;

            for (let j = 0; j <= numVertical; j++) {
                const x = (width * j) / numVertical;
                ctx.beginPath();
                ctx.moveTo(x, height);
                ctx.lineTo(vpX, vpY);
                ctx.stroke();
            }

            ctx.restore();
            ctx.restore();
            time++;
            requestAnimationFrame(drawTerrain);
        }

        function resizeCanvas() {
            width = container.clientWidth;
            height = container.clientHeight;
            canvas.width = width;
            canvas.height = height;
        }

        let resizeTimeout;
        window.addEventListener('resize', () => {
            clearTimeout(resizeTimeout);
            resizeTimeout = setTimeout(() => {
                resizeCanvas();
            }, 200);
        });

        // Redibujar al cambiar tamaño
        const observer = new ResizeObserver(() => {
            resizeCanvas();
        });
        observer.observe(container);

        drawTerrain();
    </script>
</body>
</html>
